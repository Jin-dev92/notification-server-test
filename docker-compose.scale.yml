version: '3.8'

# 다중 인스턴스 검증용 — 서버 2개 + nginx 로드밸런서
# 실행: docker-compose -f docker-compose.scale.yml up --build
# 검증:
#   SSE 연결 (nginx → app1):  curl -N http://localhost/notifications/stream?userId=user1
#   서버B 직접 발송 (app2):   curl -X POST http://localhost:3001/notifications -H "Content-Type: application/json" -d '{"userId":"user1","title":"서버B에서 발송"}'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  app1:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notification_db
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  app2:
    build: .
    ports:
      - '3001:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notification_db
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2

volumes:
  postgres_data:
